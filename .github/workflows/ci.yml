# Correctness of the AVX-512 library.
#
# GitHub's x86-64 runners do not reliably offer AVX-512 and QEMU's TCG stops at
# AVX2 (qemu-project/qemu#2878), so the binaries are built with
# -mavx512f -mavx512bw and executed under Intel SDE (Software Development
# Emulator), whose Sapphire Rapids model translates the AVX-512 instructions.
# Sanitizers are run natively when the runner happens to have AVX-512, and
# skipped (with a notice) otherwise.
#
# Every build uses -Wall -Wextra -Werror: the header is meant to be included
# into other people's warning-clean builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:      # the Release workflow runs this first

env:
  WARNINGS: -Wall -Wextra -Werror

jobs:
  avx512-sde:
    name: AVX-512 (Linux x86-64, GCC 14, Intel SDE)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install GCC 14
        run: sudo apt-get update && sudo apt-get install -y g++-14
      - name: Install Intel SDE
        uses: petarpetrovt/setup-sde@v6.0
      - name: Build
        run: |
          cmake -B build -S . -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_FLAGS="$WARNINGS"
          cmake --build build -j
      - name: Test under SDE (Sapphire Rapids)
        run: |
          for t in build/benchmark/test_guardzilla_* build/benchmark/test_needlehammer_* build/benchmark/test_api build/benchmark/test_api_singleheader; do
            echo "== $t"
            case "$t" in *test_guardzilla_*|*test_needlehammer_*) arg=--quick ;; *) arg= ;; esac
            "$SDE_PATH/sde64" -spr -- "./$t" $arg
          done
          python3 tools/amalgamate.py --check
      - name: Benchmark smoke test under SDE
        run: |
          "$SDE_PATH/sde64" -spr -- ./build/benchmark/search_bench_guardzilla --rounds 1 --lengths 16 \
              corpora benchmark/data/43-0.txt
      - name: Sanitizers (native, when the runner has AVX-512)
        run: |
          if grep -q avx512bw /proc/cpuinfo; then
            cmake -B build-san -S . -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                  -DSIMDSEARCH_BENCHMARKS=OFF \
                  -DCMAKE_CXX_FLAGS="$WARNINGS -fsanitize=address,undefined -fno-omit-frame-pointer"
            cmake --build build-san -j
            ASAN_OPTIONS=detect_leaks=0 ctest --test-dir build-san --output-on-failure
          else
            echo "::notice::This runner has no AVX-512; the sanitizer run is skipped (the tests above ran under SDE)."
          fi
